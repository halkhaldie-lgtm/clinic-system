<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة العيادات والتذاكر</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .status-banner {
      background-color: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      border: 1px solid #a5d6a7;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #f8f9fa;
      color: #333;
    }
    .badge {
      padding: 5px 10px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
    }
    .badge-waiting { background-color: #ffc107; color: #000; }
    .badge-done { background-color: #28a745; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏥 نظام طلبات واستدعاء العيادات المباشر</h1>
    <div class="status-banner">🟢 النظام متصل وجاهز للاستخدام من جميع الموظفين</div>

    <div class="form-group">
      <label for="patientName">اسم المريض:</label>
      <input type="text" id="patientName" placeholder="أدخل اسم المريض">
    </div>

    <div class="form-group">
      <label for="clinicType">اختر العيادة:</label>
      <select id="clinicType">
        <option value="عيادة النساء والأطفال">عيادة النساء والأطفال</option>
        <option value="عيادة الجراحة والجهاز الهضمي">عيادة الجراحة والجهاز الهضمي</option>
        <option value="العيادات الخارجية (OPD)">العيادات الخارجية (OPD)</option>
      </select>
    </div>

    <button onclick="addTicket()">إضافة تذكرة جديدة</button>

    <table>
      <thead>
        <tr>
          <th>رقم التذكرة</th>
          <th>اسم المريض</th>
          <th>العيادة</th>
          <th>الحالة</th>
        </tr>
      </thead>
      <tbody id="ticketsList">
        <tr>
          <td>101</td>
          <td>مريض تجريبي</td>
          <td>عيادة النساء والأطفال</td>
          <td><span class="badge badge-waiting">في الانتظار</span></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    let ticketCounter = 102;

    function addTicket() {
      const nameInput = document.getElementById('patientName');
      const clinicInput = document.getElementById('clinicType');

      if (!nameInput.value.trim()) {
        alert('يرجى إدخال اسم المريض');
        return;
      }

      const tbody = document.getElementById('ticketsList');
      const newRow = document.createElement('tr');

      newRow.innerHTML = `
        <td>${ticketCounter++}</td>
        <td>${nameInput.value}</td>
        <td>${clinicInput.value}</td>
        <td><span class="badge badge-waiting">في الانتظار</span></td>
      `;

      tbody.appendChild(newRow);
      nameInput.value = '';
    }
  </script>
</body>
</html>
