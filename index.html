</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logo"><i>🏥</i><h2>نظام إدارة العيادات</h2><div class="mut">العيادات · مركز التواصل · علاقات العملاء</div></div><div class="tabs"><button id="lt" class="on" onclick="authTab('login')">تسجيل الدخول</button><button id="rt" onclick="authTab('register')">إنشاء حساب</button></div><section id="login"><div class="field"><label>اسم المستخدم</label><input id="lu" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">دخول</button><div class="divider"></div><div class="mut">حساب الإدارة الأولي: admin / admin123</div></section><section id="register" class="hidden"><div class="field"><label>نوع الحساب</label><select id="rr" onchange="regRole()"><option value="clinic">موظف عيادة</option><option value="callcenter">موظف مركز التواصل</option><option value="customer">مسؤول علاقات العملاء</option><option value="admin">مدير النظام</option></select></div><div class="field"><label>اسم الموظف</label><input id="rn"></div><div id="regClinicWrap" class="field"><label>العيادة الأولى</label><select id="rc"></select></div><div class="field"><label>اسم المستخدم</label><input id="ru"></div><div class="field"><label>كلمة المرور</label><input id="rp" type="password"></div><button class="btn success" style="width:100%" onclick="register()">إنشاء الحساب</button></section></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand"><i>🏥</i><div><h1>نظام إدارة العيادات ومركز التواصل</h1><small id="sub"></small></div></div><div class="user"><span id="clinicPill" class="pill hidden"></span><span id="userPill" class="pill"></span><button class="btn light" onclick="logout()">خروج</button></div></header><div class="layout"><aside><div id="nav"></div><button class="nav" onclick="notifications()">🔔 الإشعارات <span id="unread"></span></button></aside><main class="main"><div id="content"></div></main></div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div id="modalbox" class="modalbox"></div></div><div id="toastbox" class="toastbox"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";import{getDatabase,ref,onValue,set,update,push}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app=initializeApp({apiKey:"AIzaSyDu_6tZHhiE9Rt5AwvkiEggAtcLtqHhe7A",authDomain:"clinic-callcenter-system.firebaseapp.com",databaseURL:"https://clinic-callcenter-system-default-rtdb.firebaseio.com",projectId:"clinic-callcenter-system",storageBucket:"clinic-callcenter-system.firebasestorage.app",messagingSenderId:"933268960406",appId:"1:933268960406:web:fc1463aa52a2d4b84cbeb7"}),db=getDatabase(app);
const CLINICS=["عيادة النساء والأطفال (ولاء)","عيادة الجراحة والجهاز الهضمي (طارق)","عيادة العظام","عيادة الأسنان","العيادات الخارجية (OPD)","عيادة الباطنية","عيادة المسالك البولية","عيادة القلب","عيادة الجلدية","عيادة الأنف والأذن والحنجرة"],STATUSES=["يستقبل الانتظار","الدكتور مستأذن","تم إيقاف الانتظار","الطبيب مريض","إجازة طارئة"],DURS=[["15","15 دقيقة"],["30","30 دقيقة"],["60","ساعة"],["120","ساعتان"],["240","4 ساعات"],["480","8 ساعات"],["1440","يوم كامل"],["0","حتى الإيقاف اليدوي"]];
let U=null,P="home",clinic="",D={users:{},clinics:{},messages:{},tickets:{},notifications:{},audit:{}};const $=id=>document.getElementById(id),T=()=>Date.now(),time=t=>t?new Date(t).toLocaleString("ar-KW",{dateStyle:"short",timeStyle:"medium"}):"-",esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),key=x=>btoa(unescape(encodeURIComponent(x))).replace(/=/g,"").slice(0,90),toast=x=>{let e=document.createElement("div");e.className="toast";e.textContent=x;$("toastbox").appendChild(e);setTimeout(()=>e.remove(),4000)},opts=(sel="")=>CLINICS.map(x=>`<option value="${esc(x)}" ${x===sel?"selected":""}>${esc(x)}</option>`).join(""),dur=(sel="60")=>DURS.map(x=>`<option value="${x[0]}" ${x[0]===String(sel)?"selected":""}>${x[1]}</option>`).join(""),role=r=>({clinic:"موظف عيادة",callcenter:"موظف مركز التواصل",customer:"مسؤول علاقات العملاء",admin:"مدير النظام"}[r]||r),badge=s=>`<span class="badge ${s==="يستقبل الانتظار"?"green":s==="تم إيقاف الانتظار"?"yellow":s?.includes("مريض")||s?.includes("إجازة")?"red":"gray"}">${esc(s||"غير محدد")}</span>`;
function authTab(x){$("login").classList.toggle("hidden",x!=="login");$("register").classList.toggle("hidden",x!=="register");$("lt").classList.toggle("on",x==="login");$("rt").classList.toggle("on",x==="register");if(x==="register"){$("rc").innerHTML=opts(CLINICS[0]);regRole()}}function regRole(){$("regClinicWrap").classList.toggle("hidden",$("rr").value!=="clinic")}window.authTab=authTab;window.regRole=regRole;
function listen(){onValue(ref(db,"users"),s=>{D.users=s.val()||{};rerender(["users"])});onValue(ref(db,"clinics"),s=>{D.clinics=s.val()||{};rerender(["home","clinics","status","dashboard"])});onValue(ref(db,"messages"),s=>{D.messages=s.val()||{};rerender(["home","messages","inbox","clinics","dashboard","reports"]);notif()});onValue(ref(db,"tickets"),s=>{D.tickets=s.val()||{};rerender(["home","tickets","inbox","dashboard","reports"])});onValue(ref(db,"notifications"),s=>{D.notifications=s.val()||{};notif()});onValue(ref(db,"audit"),s=>{D.audit=s.val()||{};rerender(["audit","reports","dashboard","home"])});}
async function login(){let u=$("lu").value.trim().toLowerCase(),p=$("lp").value;if(u==="admin"&&p==="admin123"){U={id:"admin",name:"مدير النظام",username:"admin",role:"admin",clinics:CLINICS};enter();return}let z=Object.entries(D.users).find(([id,x])=>x.username?.toLowerCase()===u&&x.password===p&&x.active!==false);if(!z)return toast("اسم المستخدم أو كلمة المرور غير صحيحة");U={id:z[0],...z[1]};enter()}
async function register(){let r=$("rr").value,n=$("rn").value.trim(),u=$("ru").value.trim().toLowerCase(),p=$("rp").value,c=$("rc").value;if(!n||!u||!p)return toast("أكمل جميع البيانات");if(u==="admin"||Object.values(D.users).some(x=>x.username?.toLowerCase()===u))return toast("اسم المستخدم مستخدم مسبقاً");let id=push(ref(db,"users")).key,x={name:n,username:u,password:p,role:r,active:true,createdAt:T(),clinics:r==="clinic"?[c]:[]};await set(ref(db,"users/"+id),x);audit("إنشاء حساب",{target:id});toast("تم إنشاء الحساب");$("lu").value=u;$("lp").value=p;authTab("login")}
function enter(){clinic=U.role==="clinic"?(U.clinics?.[0]||CLINICS[0]):CLINICS[0];$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("userPill").textContent=`👤 ${U.name} · ${role(U.role)}`;$("sub").textContent=role(U.role);$("clinicPill").classList.toggle("hidden",U.role!=="clinic");$("clinicPill").textContent=U.role==="clinic"?`🏥 ${clinic}`:"";listen();nav();render()}
function logout(){location.reload()}window.login=login;window.register=register;window.logout=logout;
const menus={clinic:[["home","🏠 الرئيسية"],["status","🩺 حالة الطبيب"],["messages","💬 رسائل للكول سنتر"],["inbox","📥 الوارد"],["reports","📊 تقارير"]],callcenter:[["home","🏠 الرئيسية"],["clinics","🏥 جميع العيادات"],["tickets","🎫 التيكتات"],["inbox","📥 الوارد"],["sent","📤 المرسل"],["dashboard","📊 الداشبورد"],["reports","📑 التقارير"]],customer:[["home","🏠 الرئيسية"],["clinics","🏥 جميع العيادات"],["inbox","📥 الوارد"],["dashboard","📊 الداشبورد"],["reports","📑 التقارير"],["audit","🕒 سجل العمليات"]],admin:[["home","🏠 الرئيسية"],["clinics","🏥 جميع العيادات"],["dashboard","📊 الداشبورد"],["reports","📑 التقارير"],["users","👥 الحسابات"],["audit","🕒 سجل العمليات"]]};
function nav(){$("nav").innerHTML=(menus[U.role]||menus.customer).map(x=>`<button class="nav ${P===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")}function go(x){P=x;nav();render()}window.go=go;function rerender(a){if(a.includes(P))render();notif()}
function render(){let f={home:home,status:statusPage,messages:messagesPage,inbox:inbox,clinics:clinics,tickets:tickets,sent:sent,dashboard:dashboard,reports:reports,users:users,audit:audit}[P]||home;f()}
function stat(label,n,ico){return `<div class="card stat"><em>${ico}</em><span>${label}</span><b>${esc(n)}</b></div>`}
function cstatus(c){let x=D.clinics[key(c)]||{};return `<div class="notice ${x.status==="تم إيقاف الانتظار"?"warn":x.status&&x.status!=="يستقبل الانتظار"?"red":""}"><b>${esc(x.doctorName||"لم يحدد الطبيب")}</b><br>${badge(x.status||"غير محدد")}<div class="meta">آخر تحديث: ${time(x.updatedAt)} · ${esc(x.updatedBy||"")}</div></div>`}
function activeMsgs(c,kind=null){return Object.entries(D.messages||{}).map(([id,x])=>({id,...x})).filter(x=>(!kind||x.kind===kind)&&(!c||x.clinic===c)&&x.enabled!==false&&(!x.expiresAt||x.expiresAt===0||x.expiresAt>T()))}
function allTickets(c=null){return Object.entries(D.tickets||{}).map(([id,x])=>({id,...x})).filter(x=>!c||x.clinic===c)}
function audit(a,e={}){let id=push(ref(db,"audit")).key;set(ref(db,"audit/"+id),{action:a,user:U?.name||"",role:U?.role||"",at:T(),...e})}
async function notify(r,c,title,message,page="inbox"){let id=push(ref(db,"notifications")).key;return set(ref(db,"notifications/"+id),{targetRole:r,targetClinic:c||"",title,message,at:T(),read:false,page})}
function home(){let html=`<div class="head"><div><h2>مرحباً ${esc(U.name)} 👋</h2><p>${U.role==="clinic"?`العيادة الحالية: ${esc(clinic)}`:"لوحة المتابعة الرئيسية"}</p></div></div>`;if(U.role==="clinic"){let ts=allTickets(clinic).filter(x=>x.status!=="closed"),ms=activeMsgs(clinic,"callNote");html+=`<div class="grid g4">${stat("تيكتات مفتوحة",ts.length,"🎫")}${stat("رسائل واردة",ms.length,"📥")}${stat("العيادة",D.clinics[key(clinic)]?.status||"-","🩺")}${stat("إشعارات",unread(),"🔔")}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>حالة الطبيب</h3>${cstatus(clinic)}<div class="actions" style="margin-top:10px"><button class="btn primary" onclick="go('status')">تعديل الحالة</button><button class="btn soft" onclick="go('messages')">رسالة للكول سنتر</button></div></div><div class="card"><h3>آخر الوارد</h3>${ticketList(ts.slice(0,5))}</div></div>`}else{let t=allTickets().filter(x=>x.status!=="closed"),m=Object.values(D.messages||{});html+=`<div class="grid g4">${stat("التيكتات المفتوحة",t.length,"🎫")}${stat("الرسائل",m.length,"💬")}${stat("العيادات",CLINICS.length,"🏥")}${stat("الإشعارات",unread(),"🔔")}</div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>حالات العيادات</h3>${CLINICS.slice(0,6).map(c=>`<div class="clinic"><h4>${esc(c)}</h4>${cstatus(c)}</div>`).join("")}</div><div class="card"><h3>آخر العمليات</h3>${auditList(8)}</div></div>`}$('content').innerHTML=html}
function statusPage(){let x=D.clinics[key(clinic)]||{};$('content').innerHTML=`<div class="head"><div><h2>حالة الطبيب والعيادة</h2><p>${esc(clinic)}</p></div></div><div class="grid g2"><div class="card"><h3>تحديث الحالة</h3><div class="field"><label>اسم الطبيب</label><input id="dn" value="${esc(x.doctorName||"")}"></div><div class="formgrid"><div class="field"><label>الحالة</label><select id="ds">${STATUSES.map(s=>`<option ${s===(x.status||STATUSES[0])?"selected":""}>${s}</option>`).join("")}</select></div><div class="field"><label>مدة الظهور للكول سنتر</label><select id="dd">${dur(x.duration||"60")}</select></div></div><label class="check"><input id="de" type="checkbox" ${x.enabled===false?"checked":""}> إيقاف المعلومة يدوياً</label><button class="btn primary" style="margin-top:12px" onclick="saveStatus()">حفظ وإرسال</button></div><div class="card"><h3>العيادة التي أعمل بها اليوم</h3><div class="field"><label>اختيار العيادة</label><select id="myclinic">${opts(clinic)}</select></div><button class="btn soft" onclick="changeClinic()">تغيير العيادة الحالية</button><div class="divider"></div>${cstatus(clinic)}</div></div>`}
async function saveStatus(){let d=$("dn").value.trim(),s=$("ds").value,du=$("dd").value,en=!$("de").checked;if(!d)return toast("اكتب اسم الطبيب");let exp=du==="0"?0:T()+Number(du)*60000,x={name:clinic,doctorName:d,status:s,enabled:en,duration:du,expiresAt:exp,updatedAt:T(),updatedBy:U.name};await set(ref(db,"clinics/"+key(clinic)),x);let id=push(ref(db,"messages")).key;await set(ref(db,"messages/"+id),{kind:"clinicStatus",clinic,doctorName:d,status:s,enabled:en,duration:du,expiresAt:exp,createdAt:T(),createdBy:U.name,createdById:U.id,target:"callcenter"});await notify("callcenter",clinic,"تحديث حالة عيادة",`${clinic}: ${d} — ${s}`);await notify("customer",clinic,"تحديث حالة عيادة",`${clinic}: ${d} — ${s}`);audit("تحديث حالة عيادة",{clinic,status:s});toast("تم الحفظ والإرسال");render()}
async function changeClinic(){let c=$("myclinic").value;clinic=c;let arr=Array.isArray(U.clinics)?U.clinics:[];if(!arr.includes(c)){arr.push(c);U.clinics=arr;await update(ref(db,"users/"+U.id),{clinics:arr})}$("clinicPill").textContent=`🏥 ${c}`;audit("تغيير العيادة",{clinic:c});toast("تم تغيير العيادة");render()}

function messagesPage(){let mine=Object.entries(D.messages||{}).map(([id,x])=>({id,...x})).filter(x=>x.kind==="clinicMessage"&&x.clinic===clinic&&x.createdById===U.id);$('content').innerHTML=`<div class="head"><div><h2>رسائل العيادة للكول سنتر</h2><p>كل رسالة مرتبطة بالعيادة الحالية والموظف والوقت والمدة</p></div></div><div class="grid g2"><div class="card"><h3>رسالة جديدة</h3><div class="formgrid"><div class="field"><label>رقم الهاتف</label><input id="mp"></div><div class="field"><label>رقم الملف</label><input id="mf"></div><div class="field"><label>مدة الظهور</label><select id="md">${dur()}</select></div><div class="field"><label>حالة الرسالة</label><select id="me"><option value="1">فعالة</option><option value="0">موقوفة</option></select></div><div class="field full"><label>التفاصيل / طلب الإجراء</label><textarea id="mt" placeholder="مثال: في حال تلقّي اتصال من المريض يرجى إبلاغنا..."></textarea></div></div><button class="btn primary" onclick="sendClinicMessage()">إرسال للكول سنتر</button></div><div class="card"><h3>رسائلي</h3>${messageList(mine)}</div></div>`}
async function sendClinicMessage(){let text=$("mt").value.trim();if(!text)return toast("اكتب الرسالة");let du=$("md").value,en=$("me").value==="1",id=push(ref(db,"messages")).key,exp=du==="0"?0:T()+Number(du)*60000,x={kind:"clinicMessage",clinic,text,phone:$("mp").value.trim(),fileNo:$("mf").value.trim(),duration:du,enabled:en,expiresAt:exp,createdAt:T(),createdBy:U.name,createdById:U.id,target:"callcenter"};await set(ref(db,"messages/"+id),{id,...x});await notify("callcenter",clinic,"رسالة جديدة من العيادة",text);audit("إرسال رسالة للكول سنتر",{clinic,messageId:id});toast("تم الإرسال");render()}
function messageList(a){if(!a.length)return`<div class="empty">لا توجد رسائل</div>`;return a.sort((a,b)=>b.createdAt-a.createdAt).map(x=>`<div class="item"><div class="itemhead"><b>${esc(x.kind==="clinicStatus"?`${x.doctorName} — ${x.status}`:x.text)}</b>${x.enabled===false?'<span class="badge gray">موقوف</span>':'<span class="badge blue">فعال</span>'}</div>${x.kind!=="clinicStatus"?`<div class="msg">${esc(x.text)}</div>`:""}<div class="meta">🏥 ${esc(x.clinic)} · 👤 ${esc(x.createdBy)} · 🕒 ${time(x.createdAt)} · ⏱️ <span class="timer" data-exp="${x.expiresAt||0}">${x.expiresAt?remain(x.expiresAt):"يدوي"}</span></div>${x.kind==="clinicMessage"&&(x.createdById===U.id||U.role==="admin")?`<div class="actions"><button class="btn light" onclick="editMsg('${x.id}')">تعديل / إيقاف</button></div>`:""}</div>`).join("")}
function remain(e){if(!e)return"حتى الإيقاف";let d=e-T();if(d<=0)return"منتهية";return`${Math.floor(d/60000)}د ${String(Math.floor(d/1000)%60).padStart(2,"0")}ث`}
function inbox(){let ms=Object.entries(D.messages||{}).map(([id,x])=>({id,...x})).filter(x=>x.kind==="clinicMessage"&&x.target==="clinic"&&(U.role!=="clinic"||x.clinic===clinic)),ts=allTickets(U.role==="clinic"?clinic:null).filter(x=>x.target==="clinic"||U.role!=="clinic");$('content').innerHTML=`<div class="head"><div><h2>الوارد</h2><p>${U.role==="clinic"?`رسائل وتيكتات العيادة ${esc(clinic)}`:"الوارد حسب العيادة"}</p></div></div><div class="grid g2"><div class="card"><h3>الرسائل</h3>${messageList(ms)}</div><div class="card"><h3>التيكتات</h3>${ticketList(ts)}</div></div>`}
function ticketList(a){if(!a.length)return`<div class="empty">لا توجد تيكتات</div>`;return`<div>${a.sort((a,b)=>b.createdAt-a.createdAt).map(x=>`<div class="item"><div class="itemhead"><b>🎫 ${esc(x.fileNo||"بدون ملف")} ${x.priority==="high"?'<span class="badge red">عاجل</span>':''}</b><span class="badge ${x.status==="closed"?"gray":"blue"}">${x.status==="closed"?"مغلق":"مفتوح"}</span></div><div class="msg">${esc(x.text)}</div><div class="meta">🏥 ${esc(x.clinic)} · 📞 ${esc(x.phone||"-")} · 👤 ${esc(x.createdBy)} · 🕒 ${time(x.createdAt)}</div>${x.status!=="closed"&&U.role!=="customer"?`<button class="btn success" style="margin-top:7px" onclick="closeTicket('${x.id}')">إغلاق</button>`:""}</div>`).join("")}</div>`}
function tickets(){ $('content').innerHTML=`<div class="head"><div><h2>التيكتات</h2><p>أرسل التيكت لعيادة محددة فقط</p></div><button class="btn primary" onclick="newTicket()">🎫 تيكت جديد</button></div><div class="card">${ticketList(allTickets())}</div>`}
function newTicket(){modal(`<div class="mhead"><h3>تيكت جديد</h3><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>العيادة</label><select id="tc">${opts()}</select></div><div class="field"><label>رقم الهاتف</label><input id="tp"></div><div class="field"><label>رقم الملف</label><input id="tf"></div><div class="field"><label>الأولوية</label><select id="txp"><option value="normal">عادي</option><option value="high">عاجل</option></select></div><div class="field full"><label>التفاصيل</label><textarea id="tt"></textarea></div></div><button class="btn primary" onclick="createTicket()">إرسال</button>`)}
async function createTicket(){let c=$("tc").value,t=$("tt").value.trim();if(!t)return toast("اكتب التفاصيل");let id=push(ref(db,"tickets")).key,x={id,clinic:c,target:"clinic",phone:$("tp").value.trim(),fileNo:$("tf").value.trim(),priority:$("txp").value,text:t,status:"open",createdAt:T(),createdBy:U.name,createdById:U.id};await set(ref(db,"tickets/"+id),x);await notify("clinic",c,"تيكت جديد من الكول سنتر",t);audit("إنشاء تيكت",{clinic:c,ticketId:id});closeModal();toast("تم إرسال التيكت للعيادة المحددة");render()}
async function closeTicket(id){let x=D.tickets[id];await update(ref(db,"tickets/"+id),{status:"closed",closedAt:T(),closedBy:U.name});if(x)await notify(x.targetRole||"callcenter",x.clinic,"تحديث تيكت","تم إغلاق التيكت");audit("إغلاق تيكت",{clinic:x?.clinic,ticketId:id});toast("تم الإغلاق");render()}
window.sendClinicMessage=sendClinicMessage;window.newTicket=newTicket;window.createTicket=createTicket;window.closeTicket=closeTicket;

function clinicDetails(c){c=decodeURIComponent(c);modal(`<div class="mhead"><h3>${esc(c)}</h3><button class="close" onclick="closeModal()">✕</button></div>${cstatus(c)}<div class="divider"></div><h3>الرسائل</h3>${messageList(activeMsgs(c))}<div class="divider"></div><h3>التيكتات</h3>${ticketList(allTickets(c))}`)}
function sent(){let m=Object.entries(D.messages||{}).map(([id,x])=>({id,...x})).filter(x=>x.createdById===U.id),t=Object.values(D.tickets||{}).filter(x=>x.createdById===U.id);$('content').innerHTML=`<div class="head"><div><h2>المرسل</h2><p>اسم الموظف ووقت الإرسال محفوظان تلقائياً</p></div></div><div class="grid g2"><div class="card"><h3>الرسائل</h3>${messageList(m)}</div><div class="card"><h3>التيكتات</h3>${ticketList(t)}</div></div>`}
function dashboard(){$('content').innerHTML=`<div class="head"><div><h2>الداشبورد</h2><p>ملخص شامل حسب العيادة والموظف</p></div></div><div class="grid g4">${stat("كل التيكتات",Object.keys(D.tickets).length,"🎫")}${stat("كل الرسائل",Object.keys(D.messages).length,"💬")}${stat("العيادات",CLINICS.length,"🏥")}${stat("المستخدمون",Object.keys(D.users).length+1,"👥")}</div><div class="card" style="margin-top:14px"><div class="tablewrap"><table class="table"><thead><tr><th>العيادة</th><th>الطبيب</th><th>الحالة</th><th>التيكتات</th><th>رسائل العيادة</th><th>آخر تحديث</th></tr></thead><tbody>${CLINICS.map(c=>`<tr><td>${esc(c)}</td><td>${esc(D.clinics[key(c)]?.doctorName||"-")}</td><td>${badge(D.clinics[key(c)]?.status||"-")}</td><td>${allTickets(c).length}</td><td>${activeMsgs(c,"clinicMessage").length}</td><td>${time(D.clinics[key(c)]?.updatedAt)}</td></tr>`).join("")}</tbody></table></div></div>`}
function reports(){$('content').innerHTML=`<div class="head"><div><h2>التقارير</h2><p>تنزيل CSV شامل للاستخدام في Excel</p></div><button class="btn success" onclick="downloadCSV()">⬇️ تنزيل التقرير</button></div><div class="card"><div class="formgrid"><div class="field"><label>العيادة</label><select id="rf"><option value="">كل العيادات</option>${opts()}</select></div><div class="field"><label>النوع</label><select id="rt"><option value="all">الكل</option><option value="ticket">تيكتات</option><option value="message">رسائل</option><option value="audit">عمليات</option></select></div></div></div>`}
function downloadCSV(){let c=$("rf").value,t=$("rt").value,r=[["النوع","العيادة","التفاصيل","الموظف","التاريخ والوقت"]],add=(a,type)=>a.filter(x=>!c||x.clinic===c).forEach(x=>r.push([type,x.clinic||"",x.text||x.action||`${x.doctorName||""} ${x.status||""}`,x.createdBy||x.user||"",time(x.createdAt||x.at)]));if(t==="all"||t==="ticket")add(Object.values(D.tickets),"تيكت");if(t==="all"||t==="message")add(Object.values(D.messages),"رسالة");if(t==="all"||t==="audit")add(Object.values(D.audit),"عملية");let b=new Blob(["\ufeff"+r.map(z=>z.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`clinic-report-${new Date().toISOString().slice(0,10)}.csv`;a.click();audit("تنزيل تقرير",{clinic:c||"الكل"})}
function users(){let a=Object.entries(D.users);$('content').innerHTML=`<div class="head"><div><h2>إدارة الحسابات</h2><p>حسابات موظفي العيادات والكول سنتر وعلاقات العملاء</p></div><button class="btn primary" onclick="userModal()">➕ حساب</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>العيادات</th><th>الحالة</th><th>الوقت</th><th></th></tr></thead><tbody>${a.map(([id,x])=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${role(x.role)}</td><td>${esc((x.clinics||[]).join("، ")||"-")}</td><td>${x.active===false?'<span class="badge red">موقوف</span>':'<span class="badge green">فعال</span>'}</td><td>${time(x.createdAt)}</td><td><button class="btn light" onclick="userModal('${id}')">تعديل</button></td></tr>`).join("")}</tbody></table></div></div>`}
function userModal(id=""){let x=id?D.users[id]:{};modal(`<div class="mhead"><h3>${id?"تعديل حساب":"إنشاء حساب"}</h3><button class="close" onclick="closeModal()">✕</button></div><div class="formgrid"><div class="field"><label>الاسم</label><input id="un" value="${esc(x.name||"")}"></div><div class="field"><label>اسم المستخدم</label><input id="uu" value="${esc(x.username||"")}"></div><div class="field"><label>الدور</label><select id="ur"><option value="clinic" ${x.role==="clinic"?"selected":""}>موظف عيادة</option><option value="callcenter" ${x.role==="callcenter"?"selected":""}>مركز التواصل</option><option value="customer" ${x.role==="customer"?"selected":""}>علاقات العملاء</option><option value="admin" ${x.role==="admin"?"selected":""}>مدير النظام</option></select></div><div class="field"><label>كلمة المرور</label><input id="up" type="password" placeholder="${id?"اتركها فارغة إذا لا تريد تغييرها":"مطلوبة"}"></div><div class="field full"><label>العيادات</label><div class="grid g2">${CLINICS.map(c=>`<label class="check"><input type="checkbox" name="uc" value="${esc(c)}" ${(x.clinics||[]).includes(c)?"checked":""}>${esc(c)}</label>`).join("")}</div></div><div class="field full"><label class="check"><input id="ua" type="checkbox" ${x.active!==false?"checked":""}> الحساب فعال</label></div></div><button class="btn primary" onclick="saveUser('${id}')">حفظ</button>`)}
async function saveUser(id){let n=$("un").value.trim(),u=$("uu").value.trim().toLowerCase(),r=$("ur").value,p=$("up").value,a=$("ua").checked,cs=[...document.querySelectorAll('input[name="uc"]:checked')].map(x=>x.value);if(!n||!u||(!id&&!p))return toast("أكمل البيانات");let dup=Object.entries(D.users).some(([k,x])=>k!==id&&x.username===u);if(dup)return toast("اسم المستخدم مستخدم");if(!id)id=push(ref(db,"users")).key;let x={name:n,username:u,role:r,active:a,clinics:r==="clinic"?cs:[],updatedAt:T()};if(p)x.password=p;if(!D.users[id])x.createdAt=T();await update(ref(db,"users/"+id),x);audit("حفظ حساب",{target:id});closeModal();toast("تم الحفظ");render()}
function auditList(n){return Object.values(D.audit).sort((a,b)=>b.at-a.at).slice(0,n).map(x=>`<div class="item"><b>${esc(x.action)}</b><div class="meta">👤 ${esc(x.user)} · 🕒 ${time(x.at)} ${x.clinic?`· 🏥 ${esc(x.clinic)}`:""}</div></div>`).join("")||`<div class="empty">لا يوجد نشاط</div>`}function audit(){let a=Object.values(D.audit).sort((x,y)=>y.at-x.at);$('content').innerHTML=`<div class="head"><div><h2>سجل العمليات</h2><p>من أضاف أو عدل ومتى</p></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>العملية</th><th>الموظف</th><th>الدور</th><th>العيادة</th><th>الوقت</th></tr></thead><tbody>${a.map(x=>`<tr><td>${esc(x.action)}</td><td>${esc(x.user)}</td><td>${role(x.role)}</td><td>${esc(x.clinic||"-")}</td><td>${time(x.at)}</td></tr>`).join("")}</tbody></table></div></div>`}
function modal(x){$("modalbox").innerHTML=x;$("modal").classList.remove("hidden")}function closeModal(){$("modal").classList.add("hidden");$("modalbox").innerHTML=""}function clinicDetails(x){x=decodeURIComponent(x);modal(`<div class="mhead"><h3>${esc(x)}</h3><button class="close" onclick="closeModal()">✕</button></div>${cstatus(x)}<div class="divider"></div>${messageList(activeMsgs(x))}<div class="divider"></div>${ticketList(allTickets(x))}`)}
function notifications(){let a=Object.entries(D.notifications).map(([id,x])=>({id,...x})).filter(x=>x.targetRole===U.role&&(!x.targetClinic||U.role!=="clinic"||x.targetClinic===clinic)).sort((a,b)=>b.at-a.at);modal(`<div class="mhead"><h3>الإشعارات</h3><button class="close" onclick="closeModal()">✕</button></div>${a.length?a.map(x=>`<div class="item"><b>${esc(x.title)}</b><div class="msg">${esc(x.message)}</div><div class="meta">${time(x.at)}</div></div>`).join(""):`<div class="empty">لا توجد إشعارات</div>`);a.filter(x=>!x.read).forEach(x=>update(ref(db,"notifications/"+x.id),{read:true}))}

async function editMsg(id){let x=D.messages[id];modal(`<div class="mhead"><h3>تعديل الرسالة</h3><button class="close" onclick="closeModal()">✕</button></div><div class="field"><label>النص</label><textarea id="et">${esc(x.text||"")}</textarea></div><div class="formgrid"><div class="field"><label>المدة</label><select id="ed">${dur(x.duration||"60")}</select></div><div class="field"><label>الحالة</label><select id="ee"><option value="1" ${x.enabled!==false?"selected":""}>فعالة</option><option value="0" ${x.enabled===false?"selected":""}>موقوفة</option></select></div></div><button class="btn primary" onclick="saveMsg('${id}')">حفظ</button>`)}async function saveMsg(id){let du=$("ed").value,en=$("ee").value==="1",x={text:$("et").value.trim(),duration:du,enabled:en,expiresAt:du==="0"?0:T()+Number(du)*60000,updatedAt:T(),updatedBy:U.name};await update(ref(db,"messages/"+id),x);audit("تعديل رسالة",{messageId:id,clinic:D.messages[id]?.clinic});closeModal();toast("تم التعديل");render()}
function startTimers(){document.querySelectorAll("[data-exp]").forEach(e=>{if(e.dataset.t){clearInterval(Number(e.dataset.t))}let i=setInterval(()=>{let x=Number(e.dataset.exp);e.textContent=x?remain(x):"يدوي";if(x&&x<=T())e.classList.add("expired")},1000);e.dataset.t=i})}
window.closeModal=closeModal;window.clinicDetails=clinicDetails;window.notifications=notifications;window.editMsg=editMsg;window.saveMsg=saveMsg;window.userModal=userModal;window.saveUser=saveUser;window.downloadCSV=downloadCSV;
setInterval(()=>{if(U){notif();startTimers()}},1500);setInterval(()=>{Object.entries(D.messages).forEach(([id,x])=>{if(x.enabled!==false&&x.expiresAt&&x.expiresAt>0&&x.expiresAt<T())update(ref(db,"messages/"+id),{enabled:false,expiredAt:T()})})},30000);
$("rc").innerHTML=opts(CLINICS[0]);listen();
</script></body></html>
